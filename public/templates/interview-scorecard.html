<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interview Scorecard | Worldwide Adverts</title>
  <style>
    body { font-family:system-ui,sans-serif; max-width:860px; margin:2rem auto; padding:0 1rem; }
    table { width:100%; border-collapse:collapse; margin-top:1rem; }
    th, td { border:1px solid #cbd5e1; padding:.65rem; text-align:left; }
    th { background:#1e3a8a; color:#fff; font-size:.8rem; }
    h1 { font-size:1.35rem; }
    [contenteditable]:focus { outline:1px dashed #2563eb; }
  </style>
</head>
<body>
  <h1>Interview scorecard</h1>
  <p contenteditable="true"><strong>Candidate:</strong> _____ · <strong>Role:</strong> _____ · <strong>Date:</strong> _____ · <strong>Interviewer:</strong> _____</p>
  <table>
    <thead>
      <tr><th>Criteria</th><th>Score (1–5)</th><th>Notes</th></tr>
    </thead>
    <tbody contenteditable="true">
      <tr><td>Role experience</td><td></td><td></td></tr>
      <tr><td>Communication</td><td></td><td></td></tr>
      <tr><td>Problem solving</td><td></td><td></td></tr>
      <tr><td>Culture fit</td><td></td><td></td></tr>
      <tr><td>Overall recommendation</td><td></td><td>Hire / Hold / No</td></tr>
    </tbody>
  </table>
</body>
</html>
